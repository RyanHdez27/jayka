version: '3.8'

services:
  app:
    build:
      context: ./docker/php
    container_name: jayka-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-jayka_db}
      DB_USERNAME: ${DB_USERNAME:-jayka_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret_password}
    networks:
      - jayka-network
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: jayka-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - jayka-network
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: jayka-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-jayka_db}
      POSTGRES_USER: ${DB_USERNAME:-jayka_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jayka_user} -d ${DB_DATABASE:-jayka_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - jayka-network

networks:
  jayka-network:
    driver: bridge

volumes:
  pgdata:
